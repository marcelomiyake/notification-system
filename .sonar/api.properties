sonar.projectKey=notification-api
sonar.projectName=Notification API
sonar.sources=notification-api/src
sonar.tests=notification-api/tests
sonar.rust.cargo.manifestPaths=notification-api/Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=notification-api/target/sonar-clippy.json
sonar.rust.lcov.reportPaths=target/sonar-api-rust-lcov.info
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,**/test-results/**
