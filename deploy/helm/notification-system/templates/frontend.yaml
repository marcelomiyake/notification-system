apiVersion: v1
kind: Service
metadata:
  name: notification-frontend
spec:
  type: ClusterIP
  selector: { app: notification-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels: { app: notification-frontend }
  template:
    metadata:
      labels: { app: notification-frontend }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
