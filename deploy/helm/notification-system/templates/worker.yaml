apiVersion: v1
kind: Service
metadata:
  name: notification-worker
spec:
  type: ClusterIP
  selector: { app: notification-worker }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels: { app: notification-worker }
  template:
    metadata:
      labels: { app: notification-worker }
    spec:
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
            - name: AMQP_URL
              value: "amqp://{{ .Values.rabbitmq.username }}:{{ .Values.rabbitmq.password }}@rabbitmq:5672/%2f"
            - { name: RUST_LOG, value: "info" }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
