apiVersion: v1
kind: Service
metadata:
  name: notification-api
spec:
  type: ClusterIP
  selector: { app: notification-api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels: { app: notification-api }
  template:
    metadata:
      labels: { app: notification-api }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.postgresKey }} } }
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}"
            - name: CALLER_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: {{ .Values.secrets.callerApiKey }} } }
            - name: DEMO_SIMULATION_ENABLED
              value: {{ .Values.api.simulationEnabled | quote }}
            - { name: RUST_LOG, value: "info" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.api.requests.cpu | quote }}
              memory: {{ .Values.resources.api.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.api.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.api.limits.cpu | quote }}
              memory: {{ .Values.resources.api.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.api.limits "ephemeral-storage" | quote }}
